name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: Vet and test
        working-directory: bridge
        run: |
          go vet ./...
          go test ./...
          go test -tags "wasm2go nodynamic" ./...
      - name: Cross-compile
        working-directory: bridge
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=android GOARCH=arm64 go build -tags "wasm2go nodynamic" -o /dev/null .
          GOOS=linux GOARCH=arm GOARM=7 go build -tags "wasm2go nodynamic" -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -tags "wasm2go nodynamic" -o /dev/null .
      - name: Build for Android with the phone's resolver (cgo)
        working-directory: bridge
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          CC_ANDROID="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$CC_ANDROID" || { echo "Android NDK not found at '$NDK'"; exit 1; }
          CGO_ENABLED=1 CC="$CC_ANDROID" GOOS=android GOARCH=arm64 go build -tags "wasm2go nodynamic" -o /tmp/tb-android .
          readelf -l /tmp/tb-android | grep "/system/bin/linker64"

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: worker
        run: node --test test/*.test.mjs
